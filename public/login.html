<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess LLM · Log in</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>">
  <style>
    :root {
      --bg: #302e2b;
      --bg-dark: #262421;
      --panel: #262522;
      --text: #ffffff;
      --muted: #a7a6a2;
      --green: #81b64c;
      --green-hover: #a3d160;
      --green-shadow: #45753c;
      --red: #e05a4f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    }
    form {
      width: 100%;
      max-width: 360px;
      background: var(--panel);
      border-radius: 10px;
      padding: 32px 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    .logo { font-size: 26px; font-weight: 800; margin: 0 0 4px; }
    .logo span { color: var(--green); }
    p { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      color: var(--text);
      background: var(--bg-dark);
      border: 1px solid #45433f;
      border-radius: 6px;
      outline: none;
    }
    input:focus { border-color: var(--green); }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      background: var(--green);
      border: 0;
      border-radius: 8px;
      box-shadow: 0 4px 0 var(--green-shadow);
      cursor: pointer;
    }
    button:hover { background: var(--green-hover); }
    .error { color: var(--red); font-size: 14px; margin: 14px 0 0; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h1 class="logo">♞ Chess<span>LLM</span></h1>
    <p>This instance is password protected.</p>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <input id="next" name="next" type="hidden">
    <button type="submit">Log in</button>
    <div id="error" class="error" hidden></div>
  </form>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById('next').value = params.get('next') ?? '/';
    const error = params.get('error');
    if (error) {
      const el = document.getElementById('error');
      el.textContent = error === 'locked' ? 'Too many attempts. Try again in 15 minutes.' : 'Wrong password.';
      el.hidden = false;
    }
  </script>
</body>
</html>
