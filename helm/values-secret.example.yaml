# Copy to values-secret.yaml (git-ignored) and fill in. Becomes the "<release>-env" Secret,
# exposed to the app as environment variables (config.json reads the API keys as ${VAR}).
secretEnv:
  ANTHROPIC_API_KEY: your-anthropic-key
  OPENAI_API_KEY: your-openai-key
  GEMINI_API_KEY: your-gemini-key
  MOONSHOT_API_KEY: your-moonshot-key
  DEEPSEEK_API_KEY: your-deepseek-key
  # Optional Langfuse tracing (leave empty to disable)
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_SECRET_KEY: ""
